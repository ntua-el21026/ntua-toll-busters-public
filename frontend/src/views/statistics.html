<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Toll Busters</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/statistics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../js/statistics.js"></script>
</head>
<body>
    <div id="navbar"></div>
    <script>
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(html => document.getElementById('navbar').innerHTML = html);
    </script>

    <section class="statistics">
        <h1>Statistics</h1>
        <p class="description">Analyze the number of passages at each toll station over your selected date range.</p>
        <div class="controls">
            <label for="start-date">Start Date:</label>
            <input type="date" id="start-date">
            <label for="end-date">End Date:</label>
            <input type="date" id="end-date">
            <button id="view-stats">View Statistics</button>
        </div>
        <div class="chart-container">
            <canvas id="barChart"></canvas>
        </div>
        <ul id="passage-list" class="passage-list">
            <!-- Dynamic list of passages -->
        </ul>
    </section>

    <div id="footer"></div>
    <script>
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
