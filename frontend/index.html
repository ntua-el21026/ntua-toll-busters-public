<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toll Busters</title>
    <link rel="stylesheet" href="./src/css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./src/app.js"></script>


</head>
<body>
    <div class="login-page">
        <!-- Logo and Heading -->
        <div class="login-header">
            <img src="./src/assets/logo.png" alt="Toll Busters Logo" class="login-logo">
            <h1 class="login-title">Welcome to Toll Busters</h1>
            <p class="login-subtitle">Your seamless toll data management solution</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group password-group">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" id="toggle-password" class="show-password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="btn login-btn">Login</button>
        </form>
    </div>
</body>
</html>
